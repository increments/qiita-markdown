version: 2
updates:

  - package-ecosystem: "bundler"
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    rebase-strategy: "disabled"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "html-pipeline"
        versions: [">=3.0"]

  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    rebase-strategy: "disabled"
    cooldown:
      default-days: 7
